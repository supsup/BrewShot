name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Browser-free tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Run browser-free lane
        run: ./gradlew unitTest --no-daemon --stacktrace

  chrome:
    name: Chrome tests (pinned container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run real-browser lane
        run: docker build --target chrome-test --tag brewshot:chrome-test .

  native:
    name: Native image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pinned GraalVM
        uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          java-version: "25.0.2"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        run: ./gradlew nativeImage --no-daemon --stacktrace

      - name: Smoke native CLI
        run: ./build/brewshot --help

  docker:
    name: Docker build + real capture smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build pinned runtime image
        run: docker build --tag brewshot:ci .

      - name: Capture HTML in the container
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          chmod 0777 "$smoke_dir"
          printf '%s\n' '<!doctype html><title>BrewShot CI</title><h1>BrewShot CI</h1>' > "$smoke_dir/page.html"
          chmod 0644 "$smoke_dir/page.html"
          docker run --rm --volume "$smoke_dir:/work" brewshot:ci \
            page.html --settle 100 -o page.png
          docker run --rm --volume "$smoke_dir:/work:ro" \
            --entrypoint /bin/sh brewshot:ci -eu -c '
              test -s /work/page.png
              test "$(od -An -t x1 -N 8 /work/page.png | tr -d " \n")" = "89504e470d0a1a0a"
            '

      # THE FOLDER-WORKER SMOKE STEP IS TEMPORARILY OUT (plan 4124aab6, brewshot/360).
      # It was wired in at 741ba49 and RED on the first real main run (31066904386): the run
      # dies in the relative-output leg of docker/smoke-test.sh (NOT RUN IN CI), which passes
      # on macOS Docker
      # and not on ubuntu-latest. The image runs as USER 10001:10001, so the uid/permission
      # semantics of a bind mount differ between the two, and every measurement backing the
      # original wiring was macOS-local.
      #
      # THIS IS A COVERAGE GAP, RECORDED RATHER THAN SILENT: docker/smoke-test.sh RUNS NOWHERE.
      # It is still the only behavioural coverage of BrewShotFolderWorker's locks, atomic
      # renames and restart recovery, and nothing invokes it. That is the exact condition plan
      # 4124aab6 exists to end, so this comment is a debt marker, not a decision.
      #
      # THE NEGATION IS ON THE SAME LINE AS THE FILENAME ON PURPOSE (review brewshot/365).
      # `grep -rn smoke-test` prints ONE line per hit and stops at the newline, so a marker
      # whose "it does not run" sits on the FOLLOWING line reads, in grep output, as evidence
      # that it DOES. That is the same shape as the missing invocation this comment records:
      # a search answering the opposite of the truth. Every line here that names the script
      # AS A SUBJECT says on that line that it is not wired in. The line directly above is the
      # deliberate exception: it names the string to EXPLAIN the rule, so it necessarily
      # matches the grep without being a claim about wiring. Stated because an unqualified
      # "every line" would be a marker asserting more than its mechanism delivers — which is
      # the exact defect this whole block exists to remove (review brewshot/376).
      #
      # It is REMOVED rather than made non-blocking, deliberately: a smoke test wired in but
      # non-blocking reproduces the original problem with extra steps, and would let this gap
      # masquerade as coverage.
      #
      # Re-landing it needs two things the first attempt lacked: per-assertion failure messages
      # (the script is `set -eu`, so today a red run names no cause — which is why this revert
      # was faster than the diagnosis), and evidence from an actual Linux run.
