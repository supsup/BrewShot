name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Browser-free tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Run browser-free lane
        run: ./gradlew unitTest --no-daemon --stacktrace

  chrome:
    name: Chrome tests (pinned container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run real-browser lane
        run: docker build --target chrome-test --tag brewshot:chrome-test .

  native:
    name: Native image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pinned GraalVM
        uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          java-version: "25.0.2"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        run: ./gradlew nativeImage --no-daemon --stacktrace

      - name: Smoke native CLI
        run: ./build/brewshot --help

  docker:
    name: Docker build + real capture smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build pinned runtime image
        run: docker build --tag brewshot:ci .

      - name: Capture HTML in the container
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          chmod 0777 "$smoke_dir"
          printf '%s\n' '<!doctype html><title>BrewShot CI</title><h1>BrewShot CI</h1>' > "$smoke_dir/page.html"
          chmod 0644 "$smoke_dir/page.html"
          docker run --rm --volume "$smoke_dir:/work" brewshot:ci \
            page.html --settle 100 -o page.png
          docker run --rm --volume "$smoke_dir:/work:ro" \
            --entrypoint /bin/sh brewshot:ci -eu -c '
              test -s /work/page.png
              test "$(od -An -t x1 -N 8 /work/page.png | tr -d " \n")" = "89504e470d0a1a0a"
            '

      # The folder worker's OWN smoke test (plan 4124aab6). docker/BrewShotFolderWorker.java is
      # 891 lines of file locks, atomic renames, inode-identity races, restart recovery and
      # multi-worker collision handling, and docker/smoke-test.sh is 387 lines that exercise
      # exactly those races — but a repo-wide grep for "smoke-test" returned ZERO references, so
      # it ran nowhere. The Dockerfile does compile the worker, so compile breaks were already
      # caught; what was missing was BEHAVIOURAL coverage of the most intricate concurrency
      # component in the project.
      #
      # Blocking on purpose. A smoke test wired in but non-blocking would reproduce the original
      # problem with extra steps.
      #
      # Runs on every push rather than on a schedule or a label: measured at ~67s locally against
      # a pre-built image, which is cheaper than the image build above it. Gating it would need a
      # reason, and there is not one — and a gate is how a test quietly stops running.
      #
      # Known rough edge, stated rather than discovered later: the script is `set -eu`, so a
      # failed assertion aborts with a non-zero exit and NO message naming which one. That is
      # enough to fail the job correctly, but a red run here means reproducing locally to find
      # out what broke.
      - name: Folder-worker concurrency smoke
        run: sh docker/smoke-test.sh brewshot:ci
