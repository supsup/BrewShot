name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Browser-free tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Run browser-free lane
        run: ./gradlew unitTest --no-daemon --stacktrace

  chrome:
    name: Chrome tests (pinned container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run real-browser lane
        run: docker build --target chrome-test --tag brewshot:chrome-test .

  native:
    name: Native image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pinned GraalVM
        uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          java-version: "25.0.2"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        run: ./gradlew nativeImage --no-daemon --stacktrace

      - name: Smoke native CLI
        run: ./build/brewshot --help

  docker:
    name: Docker build + real capture smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build pinned runtime image
        run: docker build --tag brewshot:ci .

      - name: Capture HTML in the container
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          chmod 0777 "$smoke_dir"
          printf '%s\n' '<!doctype html><title>BrewShot CI</title><h1>BrewShot CI</h1>' > "$smoke_dir/page.html"
          chmod 0644 "$smoke_dir/page.html"
          docker run --rm --volume "$smoke_dir:/work" brewshot:ci \
            page.html --settle 100 -o page.png
          docker run --rm --volume "$smoke_dir:/work:ro" \
            --entrypoint /bin/sh brewshot:ci -eu -c '
              test -s /work/page.png
              test "$(od -An -t x1 -N 8 /work/page.png | tr -d " \n")" = "89504e470d0a1a0a"
            '

      # THE FOLDER-WORKER SMOKE IS WIRED IN AND BLOCKING (plan 4124aab6, closing brewshot/360).
      # docker/smoke-test.sh is the only behavioural coverage of BrewShotFolderWorker's locks,
      # atomic renames, collision handling and restart recovery. The Dockerfile compiles that
      # worker, so a COMPILE break was always caught; nothing exercised its concurrency.
      #
      # BLOCKING ON PURPOSE, and never `continue-on-error`. A smoke test wired in but
      # non-blocking reproduces the original gap with extra steps and lets it masquerade as
      # coverage. Runs on every push: measured 52s on a Linux runner, which does not earn a
      # schedule gate. If it ever does, gate it EXPLICITLY here and say so — a silent skip is
      # the exact defect this step exists to end.
      #
      # WHY IT IS SAFE TO RE-LAND, after 741ba49 went red on the first real main run
      # (31066904386): that attempt's evidence was entirely macOS-local, and the image runs as
      # USER 10001:10001 so bind-mount uid semantics differ from ubuntu-latest. The two things
      # the revert asked for are now in hand. (1) A red run names its cause: every phase is a
      # `step`, and the failure trap prints `FAILED during phase: <name>` plus the worker logs
      # dumped below. (2) Linux evidence: the script now PASSES on a genuine linux/arm64
      # daemon under Docker-in-Docker (a host-socket mount would resolve on macOS and reproduce
      # the very blindness that took 741ba49 out). The bug was a race in the TEST, not the
      # worker — assertions read a losing worker's in-flight temp; fixed at 23424ef.
      #
      # LOAD-BEARING, PROVEN RATHER THAN ASSUMED: with the atomic claim mutated to a
      # non-atomic copy (`Files.copy` for `Files.move(..., ATOMIC_MOVE)` at
      # BrewShotFolderWorker.java:199) the script RELIABLY exits 1; the clean image exits 0.
      # Which invariant trips first is TIMING-DEPENDENT — observed at both the single-worker
      # backlog phase and the two-worker convergence phase across runs (Fixpoint reproduced
      # 2/2 and got a different phase each time). So a red run here names a real defect but
      # not a fixed site; do not treat one phase name as the signature. A green step means
      # something regardless, which is the property that matters.
      # Worker logs on failure are dumped by the SCRIPT's own trap, not by a follow-on step
      # here: cleanup() removes the worker containers on exit, so a separate `if: failure()`
      # step would run after they are gone and print nothing — a diagnostic that reports
      # success at reporting.
      - name: Folder-worker concurrency smoke
        run: sh docker/smoke-test.sh brewshot:ci
